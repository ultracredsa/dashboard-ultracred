<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Reporte UltraCred</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2303589B'/><text x='50' y='72' font-size='64' font-weight='900' font-style='italic' font-family='Arial' fill='white' text-anchor='middle'>U</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --ink:#0F1E2E; --muted:#5E6B78; --rule:#DCE3EB; --soft:#F5F8FB;
  --brand:#03589B; --brand-dark:#014C85;
  --money:#137A52; --ok:#2E8B5E; --warn:#C07F14; --crit:#C0392B; --bank:#03589B; --debit:#7453A8;
  --focus:#03589B;
  --shadow:0 1px 2px rgba(15,30,46,.05), 0 6px 18px -10px rgba(15,30,46,.20);
  color-scheme: light;
}
:root{ box-sizing:border-box; padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.45; font-variant-numeric:tabular-nums;
}
.num,.big{ white-space:nowrap; }
.num,.big,h1,.date,.y{ font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; }

/* Encabezado */
.hero{ color:#fff; padding-top:env(safe-area-inset-top,0px);
  background:radial-gradient(900px 340px at 50% 30%, #0663AB 0%, var(--brand) 45%, var(--brand-dark) 100%); }
.hero .in{ max-width:1120px; margin:0 auto; padding:26px clamp(16px,4vw,32px) 30px; }
.hero .row{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px 20px; }
.brand img{ display:block; height:clamp(26px,4.4vw,36px); width:auto; }
h1{ margin:18px 0 0; font-size:clamp(2rem,5.4vw,3.1rem); font-weight:600; line-height:1.02; }
.resumen{ margin:10px 0 0; max-width:62ch; font-size:clamp(1rem,2.2vw,1.12rem); color:rgba(255,255,255,.82); }
.resumen b{ color:#fff; font-weight:600; }
.status{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:.9rem; }
.pill{ display:inline-flex; align-items:center; gap:8px; padding:5px 12px; border-radius:999px; background:rgba(255,255,255,.12); }
.dot{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.5); display:inline-block; }
.dot.live{ background:#5BE0A0; box-shadow:0 0 0 3px rgba(91,224,160,.25); }
.dot.stale{ background:#F2B84B; }
.hero button{ background:#fff; color:var(--brand); border:0; font-weight:600; }
.hero button:hover{ background:#E6EFF8; }
.hero button:focus-visible{ outline:2px solid #fff; outline-offset:2px; }

.wrap{ max-width:1120px; margin:0 auto; padding:0 clamp(16px,4vw,32px) 48px; }
button,select{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--rule);
  border-radius:8px; padding:7px 14px; cursor:pointer;
}
button:hover{ border-color:var(--muted); }
button:focus-visible,select:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
button[disabled]{ opacity:.55; cursor:default; }

.banner{ margin:18px 0 0; padding:12px 14px; border-left:4px solid var(--warn); background:#FFF8EA; border-radius:0 8px 8px 0; }
.banner.crit{ border-left-color:var(--crit); background:#FDEEEC; }
.banner[hidden]{ display:none; }

section{ margin-top:30px; }
h2{ font-size:1.12rem; font-weight:700; margin:0 0 12px; display:flex; align-items:baseline; gap:10px; }
h2::before{ content:""; width:4px; height:1em; border-radius:2px; background:var(--brand); align-self:center; }
h2 small{ font-weight:500; color:var(--muted); font-size:.92rem; }
.panel{ background:var(--surface); border:1px solid var(--rule); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); }
.sub{ color:var(--muted); font-size:.93rem; }

/* Tira del día: sube sobre el encabezado */
.strip{ margin-top:26px; }
.figs{ display:grid; grid-template-columns:repeat(4,1fr); padding:0; overflow:hidden; }
@media (max-width:860px){ .figs{ grid-template-columns:repeat(2,1fr); } }
.fig{ padding:18px 20px; border-left:1px solid var(--rule); }
.fig:first-child{ border-left:0; }
@media (max-width:860px){ .fig:nth-child(3){ border-left:0; } .fig:nth-child(n+3){ border-top:1px solid var(--rule); } }
.fig .lbl{ color:var(--muted); font-size:.92rem; font-weight:500; display:flex; align-items:center; gap:8px; }
.fig .lbl i{ width:8px; height:8px; border-radius:2px; background:var(--c); }
.fig .num{ font-size:clamp(1.35rem,2.5vw,1.95rem); font-weight:600; line-height:1.15; margin-top:4px; }
.fig .num.zero{ color:#A5B2AC; }

@media (max-width:520px){
  .figs{ grid-template-columns:1fr; }
  .fig{ border-left:0 !important; border-top:1px solid var(--rule); display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:14px 16px; }
  .fig:first-child{ border-top:0; }
  .fig .num{ font-size:1.45rem; margin-top:0; }
}
.two{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
@media (max-width:760px){ .two{ grid-template-columns:1fr; } }
.big{ font-size:clamp(2.2rem,5.5vw,3.3rem); font-weight:600; line-height:1; }
.moraTop{ display:flex; justify-content:space-between; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-top:6px; }
.moraBig{ display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
.spark{ text-align:right; }
.spark svg{ display:block; }
.spark .sub{ font-size:.82rem; }
.tag{ font-size:.85rem; font-weight:600; padding:3px 10px; border-radius:999px; }
.tag.ok{ color:var(--ok); background:#E6F4EC; } .tag.warn{ color:#94600A; background:#FBF0D9; } .tag.crit{ color:var(--crit); background:#FBE5E2; }
.lines{ margin-top:16px; }
.line{ display:flex; justify-content:space-between; align-items:baseline; gap:8px 12px; flex-wrap:wrap; padding:9px 0; border-top:1px solid var(--rule); }
.line .num{ font-size:1.25rem; font-weight:600; }
.line.res{ margin-top:4px; padding:12px 14px; border:0; border-radius:10px; background:#EAF5EF; }
.line.res .num{ font-size:1.55rem; color:var(--money); }

.caja{ display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center; }
@media (max-width:760px){ .caja{ grid-template-columns:1fr; } }
.bar{ display:flex; gap:3px; height:16px; }
.bar span{ display:block; height:100%; border-radius:4px; min-width:4px; }
.legend{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px 18px; margin-top:16px; }
.legend div{ display:flex; flex-direction:column; }
.legend .sub::before{ content:""; display:inline-block; width:9px; height:9px; border-radius:2px; background:var(--c); margin-right:7px; }
.legend .num{ font-size:1.35rem; font-weight:600; }

/* Compensaciones como línea de tiempo */
.tl{ display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; }
.tl .it{ position:relative; padding:20px 18px 4px 0; border-top:2px solid var(--rule); }
.tl .it::before{ content:""; position:absolute; top:-7px; left:0; width:12px; height:12px; border-radius:50%; background:var(--surface); border:2px solid var(--bank); }
.tl .it.soon::before{ background:var(--bank); box-shadow:0 0 0 4px rgba(3,88,155,.18); }
.tl .when{ font-weight:600; }
.tl .falta{ color:var(--muted); font-size:.9rem; }
.tl .it.soon .falta{ color:var(--bank); font-weight:600; }
.tl .num{ font-size:1.5rem; font-weight:600; margin-top:6px; }

.controls{ display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-bottom:12px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ padding:5px 12px; border-radius:999px; font-size:.92rem; background:var(--soft); }
.chip[aria-pressed="true"]{ background:var(--brand); color:#fff; border-color:var(--brand); }
.scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table.heat{ border-collapse:separate; border-spacing:4px; min-width:660px; width:100%; }
.heat th{ font-size:.82rem; font-weight:600; color:var(--muted); padding:2px 4px; text-align:center; }
.heat th.y{ text-align:left; color:var(--ink); font-size:1.08rem; padding-right:8px; }
.heat td{ text-align:center; padding:8px 2px; border-radius:6px; font-size:.9rem; font-weight:600; transition:opacity .2s; }
.heat td.empty{ background:var(--soft); color:transparent; }
.heat td.dim{ opacity:.14; }
.keys{ display:flex; flex-wrap:wrap; gap:6px 16px; font-size:.88rem; color:var(--muted); margin-top:10px; }
.keys i{ display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.divider{ height:1px; background:var(--rule); margin:22px 0 18px; }
#chart{ margin-top:6px; }
#chart svg{ display:block; width:100%; height:auto; }
#chart text{ fill:var(--muted); font-family:"Barlow",system-ui,sans-serif; font-size:12px; }

details.raw{ margin-top:30px; }
details.raw summary{ cursor:pointer; color:var(--muted); }
table.rawt{ border-collapse:collapse; font-size:.9rem; margin-top:10px; background:var(--surface); }
.rawt td{ padding:5px 14px 5px 8px; border-bottom:1px solid var(--rule); }
.rawt td:last-child{ text-align:right; }

footer{ margin-top:30px; padding-top:14px; border-top:1px solid var(--rule); color:var(--muted); font-size:.9rem; }
.empty-state{ padding:40px 0; color:var(--muted); }
@media (prefers-reduced-motion:reduce){ *{ transition:none !important; } }
</style>
</head>

    const isPct = (c.z && String(c.z).includes("%")) || (c.v > 0 && c.v < 1);
    return isPct ? c.v * 100 : c.v;
  }
  const n = forzarNumero(c.w != null ? c.w : c.v);
  return (n > 0 && n < 1 && !String(c.v).includes("%")) ? n * 100 : n;
}
function cellDate(c){
  if (!c) return null;
  const m = String(c.v).match(/(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/);
  if (!m) return null;
  let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000;
  if (b > 12 && a <= 12){ const t = a; a = b; b = t; }
  return new Date(y, b - 1, a);
}

function parseCSV(text){
  const out = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){
      if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += ch;
    } else if (ch === '"') q = true;
    else if (ch === ","){ row.push(f); f = ""; }
    else if (ch === "\n" || ch === "\r"){
      if (ch === "\r" && text[i+1] === "\n") i++;
      row.push(f); out.push(row); row = []; f = "";
    } else f += ch;
  }
  if (f !== "" || row.length){ row.push(f); out.push(row); }
  return out;
}

function extraer(csvText){
  const rows = parseCSV(csvText).map(r => {
    const label = String(r[0] || "").trim();
    const bv = String(r[1] == null ? "" : r[1]).trim();
    return {label, up: label.toUpperCase(), b: bv === "" ? null : {t:"s", v:bv, w:bv}};
  });
  const find = t => rows.find(x => x.up.includes(t.toUpperCase()));
  const num = t => { const x = find(t); return x ? cellNum(x.b) : 0; };
  const first = (...ts) => { for (const t of ts){ const v = num(t); if (v) return v; } return 0; };

  const fechaRow = rows[0];
  let fecha = fechaRow ? cellDate(fechaRow.b) : null;
  const fechaTxt = fecha ? fecha.toLocaleDateString("es-AR",{weekday:"long", day:"numeric", month:"long", year:"numeric"})
                         : (fechaRow && fechaRow.b ? String(fechaRow.b.w || fechaRow.b.v) : new Date().toLocaleDateString("es-AR"));
  if (!fecha) fecha = new Date();

  let mora = 0;
  { const x = find("MORA TOTAL") || find("% EN MORA"); if (x) mora = cellPct(x.b); }

  const vencidoRow = find("MONTO VENCIDO");
  const cobradoRow = rows.find(x => x.up === "COBRADO");
  const montoVencido = vencidoRow ? cellNum(vencidoRow.b) : 0;
  const cobrado = cobradoRow ? cellNum(cobradoRow.b) : 0;

  const comps = [];
  for (const x of rows){
    if (x.up.includes("COMPENSACIÓN") && !x.up.includes("TOTAL")){
      const txt = x.label.replace(/[\\*]/g,"").trim();
      const m = txt.match(/(\d{1,2})\/(\d{1,2})/);
      let d = null;
      if (m){
        d = new Date(fecha.getFullYear(), +m[2]-1, +m[1]);
        if (d - fecha < -1000*60*60*24*180) d.setFullYear(d.getFullYear()+1);
      }
      comps.push({txt, fecha:d, monto: cellNum(x.b)});
      if (comps.length === 4) break;
    }
  }

  const moraHist = [], vistos = new Set();
  for (const x of rows){
    const mi = MESES.findIndex(m => x.up.includes(m));
    if (mi < 0 || x.up.includes("TOTAL") || x.up.includes("MORA") || x.up.includes("COMPENSACI")) continue;
    if (vistos.has(x.up)) continue;
    vistos.add(x.up);
    const ym = x.up.match(/20\d\d/);
    const anio = ym ? +ym[0] : fecha.getFullYear();
    moraHist.push({label:x.label, anio, mes:mi, v: cellPct(x.b)});
  }
  moraHist.sort((a,b) => (a.anio*12+a.mes) - (b.anio*12+b.mes));

  return {
    fecha, fechaTxt,
    cobradoDia: first("TOTAL COBRADO","COBRADO"),
    venta: first("VENTA (K)","VENTA (K) DEL DÍA"),
    convenios: first("INTERESES CONVENIOS","CONVENIOS"),
    egresos: first("TOTAL EGRESOS","EGRESOS DEL DÍA","EGRESOS"),
    mora,
    creditosACobrar: num("CRÉDITOS A COBRAR"),
    montoVencido, cobrado, aCobrarVencido: montoVencido - cobrado,
    efectivo: num("EFECTIVO"), bancos: num("MACRO"),
    debito: first("SUAREZ","DÉBITO"), totalCaja: first("TOTAL CAJA","CAJA TOTAL"),
    comps, moraHist,
    raw: rows.filter(x => x.label).map(x => [x.label, x.b ? (x.b.w != null ? x.b.w : String(x.b.v)) : ""])
  };
}

/* ---------- render ---------- */
const nivelDe = v => v > 12 ? "crit" : (v >= 10 ? "warn" : "ok");
const nivelTxt = {ok:"Controlada", warn:"Alerta", crit:"Crítica"};

function fig(lbl, v, c){ return `<div class="fig" style="--c:${c}"><div class="lbl"><i></i>${lbl}</div><div class="num${v ? "" : " zero"}">${money(v)}</div></div>`; }

function sparkline(hist){
  const pts = hist.slice(-12);
  if (pts.length < 2) return "";
  const W = 150, H = 44, P = 4;
  const max = Math.max(...pts.map(p => p.v), 12), min = 0;
  const x = i => P + i * (W - 2*P) / (pts.length - 1);
  const y = v => H - P - (H - 2*P) * (v - min) / (max - min);
  const d = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  const last = pts[pts.length-1], lv = nivelDe(last.v);
  const col = lv === "ok" ? "var(--money)" : lv === "warn" ? "var(--warn)" : "var(--crit)";
  return `<div class="spark"><svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mora de los últimos 12 meses">
    <line x1="${P}" x2="${W-P}" y1="${y(10)}" y2="${y(10)}" stroke="var(--warn)" stroke-dasharray="3 3" opacity=".6"/>
    <path d="${d}" fill="none" stroke="var(--muted)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${x(pts.length-1)}" cy="${y(last.v)}" r="3.5" fill="${col}"/></svg>
    <span class="sub">Últimos 12 meses</span></div>`;
}

function render(d){
  const f = d.fechaTxt.charAt(0).toUpperCase() + d.fechaTxt.slice(1);
  $("fecha").textContent = f;
  const lv = nivelDe(d.mora);
  $("resumen").innerHTML = `El día anterior se cobraron <b>${money(d.cobradoDia)}</b>. Quedan <b>${money(d.aCobrarVencido)}</b> vencidos por cobrar y la mora está en <b>${pct(d.mora)}</b>.`;
  const cajaParts = [
    {k:"Efectivo", v:d.efectivo, c:"var(--money)"},
    {k:"Bancos (Macro + FCI)", v:d.bancos, c:"var(--bank)"},
    {k:"Débito + Cnel. Suárez", v:d.debito, c:"var(--debit)"}
  ];
  const suma = cajaParts.reduce((s,p) => s + Math.max(p.v,0), 0) || 1;
  const hoy = new Date(d.fecha); hoy.setHours(0,0,0,0);
  const comps = d.comps.filter(c => c.monto > 0);

  $("main").innerHTML = `
  <section class="strip">
    <h2>Movimiento del día <small>día anterior</small></h2>
    <div class="panel figs">
      ${fig("Total cobrado", d.cobradoDia, "var(--money)")}
      ${fig("Capital vendido (K)", d.venta, "var(--bank)")}
      ${fig("Intereses convenios", d.convenios, "var(--debit)")}
      ${fig("Total egresos", d.egresos, "var(--crit)")}
    </div>
  </section>

  <section>
    <h2>Cartera</h2>
    <div class="two">
      <div class="panel">
        <div class="sub">Morosidad total</div>
        <div class="moraTop">
          <div class="moraBig"><span class="big">${pct(d.mora)}</span><span class="tag ${lv}">${nivelTxt[lv]}</span></div>
          ${sparkline(d.moraHist)}
        </div>
        <div class="lines">
          <div class="line"><span>Créditos a cobrar <span class="sub">(vencido + no vencido)</span></span><span class="num">${money(d.creditosACobrar)}</span></div>
        </div>
      </div>
      <div class="panel">
        <div class="sub">Monto total a cobrar vencido</div>
        <div class="lines">
          <div class="line"><span>Monto vencido</span><span class="num">${money(d.montoVencido)}</span></div>
          <div class="line"><span>Cobrado</span><span class="num">− ${money(d.cobrado)}</span></div>
          <div class="line res"><span><b>A cobrar vencido</b></span><span class="num">${money(d.aCobrarVencido)}</span></div>
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Caja</h2>
    <div class="panel caja">
      <div><div class="sub">Total general en caja</div><div class="big">${money(d.totalCaja)}</div></div>
      <div>
        <div class="bar" role="img" aria-label="Composición de la caja">
          ${cajaParts.map(p => `<span style="flex:${Math.max(p.v,0)/suma} 1 0;background:${p.c}" title="${esc(p.k)}"></span>`).join("")}
        </div>
        <div class="legend">
          ${cajaParts.map(p => `<div style="--c:${p.c}"><span class="sub">${esc(p.k)} · ${Math.round(Math.max(p.v,0)/suma*100)}%</span><span class="num">${money(p.v)}</span></div>`).join("")}
        </div>
      </div>
    </div>
  </section>

  <section>
    <h2>Próximas compensaciones</h2>
    ${comps.length ? `<div class="panel"><div class="tl">${comps.map(c => {
        if (!c.fecha) return `<div class="it"><div class="when">${esc(c.txt)}</div><div class="num">${money(c.monto)}</div></div>`;
        const dias = Math.round((c.fecha - hoy)/86400000);
        const when = c.fecha.toLocaleDateString("es-AR",{weekday:"short", day:"numeric", month:"short"});
        const falta = dias === 0 ? "Hoy" : dias === 1 ? "Mañana" : dias > 1 ? `En ${dias} días` : `Hace ${-dias} días`;
        return `<div class="it${dias >= 0 && dias <= 3 ? " soon" : ""}"><div class="when">${esc(when)}</div><div class="falta">${falta}</div><div class="num">${money(c.monto)}</div></div>`;
      }).join("")}</div></div>` : `<p class="sub">No hay compensaciones cargadas.</p>`}
  </section>

  <section id="mora">
    <h2>Mora histórica <small>% en mora por mes</small></h2>
    ${d.moraHist.length ? `<div class="panel">
    <div class="controls">
      <label>Mostrar <select id="nivel">
        <option value="todos">Todos los meses</option>
        <option value="crit">Crítica (más de 12%)</option>
        <option value="warn">Alerta (10% a 12%)</option>
        <option value="ok">Controlada (menos de 10%)</option>
      </select></label>
      <span id="conteo" class="sub"></span>
    </div>
    <div class="scroll"><table class="heat" id="heat"></table></div>
    <div class="keys"><span><i style="background:var(--ok)"></i>Menos de 10%</span><span><i style="background:var(--warn)"></i>10% a 12%</span><span><i style="background:var(--crit)"></i>Más de 12%</span></div>
    <div class="divider"></div>
    <div class="controls"><span class="sub">Años en el gráfico</span><div class="chips" id="chips"></div></div>
    <div id="chart"></div></div>` : `<p class="sub">No se encontraron meses con % de mora en la planilla.</p>`}
  </section>

  <details class="raw"><summary>Ver cómo se lee la planilla (control)</summary>
    <div class="scroll"><table class="rawt">${d.raw.map(r => `<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table></div>
  </details>`;

  if (d.moraHist.length){
    const years = [...new Set(d.moraHist.map(x => x.anio))].sort((a,b) => a-b);
    if (!selectedYears || !selectedYears.some(y => years.includes(y))) selectedYears = years.slice(-2);
    $("nivel").value = nivel;
    $("nivel").addEventListener("change", e => { nivel = e.target.value; renderHeat(d, years); });
    renderHeat(d, years);
    renderChips(d, years);
    renderChart(d);
  }
}

function renderHeat(d, years){
  const by = {};
  d.moraHist.forEach(x => { (by[x.anio] = by[x.anio] || {})[x.mes] = x; });
  let head = `<tr><th></th>${MES_CORTO.map(m => `<th scope="col">${m}</th>`).join("")}</tr>`;
  let body = years.map(y => `<tr><th class="y" scope="row">${y}</th>${MES_CORTO.map((_,m) => {
    const x = by[y] && by[y][m];
    if (!x) return `<td class="empty">·</td>`;
    const lv = nivelDe(x.v);
    const t = Math.min(1, Math.max(.18, x.v / 16));
    const col = lv === "ok" ? "var(--ok)" : lv === "warn" ? "var(--warn)" : "var(--crit)";
    const strong = t > .55;
    const dim = nivel !== "todos" && nivel !== lv ? " dim" : "";
    return `<td class="${dim}" style="background:color-mix(in srgb, ${col} ${Math.round(t*85)}%, var(--surface));color:${strong ? "#fff" : "var(--ink)"}" title="${esc(x.label)}: ${pct(x.v)}">${x.v.toFixed(1).replace(".",",")}</td>`;
  }).join("")}</tr>`).join("");
  $("heat").innerHTML = `<thead>${head}</thead><tbody>${body}</tbody>`;
  const n = nivel === "todos" ? d.moraHist.length : d.moraHist.filter(x => nivelDe(x.v) === nivel).length;
  $("conteo").textContent = nivel === "todos" ? `${n} meses registrados` : `${n} ${n === 1 ? "mes" : "meses"} en este nivel`;
}

function renderChips(d, years){
  $("chips").innerHTML = years.map(y => `<button type="button" class="chip" aria-pressed="${selectedYears.includes(y)}" data-y="${y}">${y}</button>`).join("");
  $("chips").onclick = e => {
    const b = e.target.closest("button[data-y]"); if (!b) return;
    const y = +b.dataset.y;
    selectedYears = selectedYears.includes(y) ? selectedYears.filter(v => v !== y) : [...selectedYears, y];
    if (!selectedYears.length) selectedYears = [y];
    renderChips(d, years); renderChart(d);
  };
}

function renderChart(d){
  const el = $("chart"); if (!el) return;
  const pts = d.moraHist.filter(x => selectedYears.includes(x.anio));
  if (!pts.length){ el.innerHTML = ""; return; }
  const W = Math.max(320, el.clientWidth || 700), H = W < 520 ? 220 : 280;
  const L = 38, R = 12, T = 12, B = 28;
  const maxV = Math.max(15, Math.ceil(Math.max(...pts.map(p => p.v)) / 5) * 5);
  const x = i => L + (pts.length === 1 ? (W-L-R)/2 : i * (W-L-R) / (pts.length - 1));
  const y = v => T + (H-T-B) * (1 - v / maxV);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Evolución del porcentaje de mora">`;
  s += `<rect x="${L}" y="${y(maxV)}" width="${W-L-R}" height="${y(12)-y(maxV)}" fill="var(--crit)" opacity=".08"/>`;
  s += `<rect x="${L}" y="${y(12)}" width="${W-L-R}" height="${y(10)-y(12)}" fill="var(--warn)" opacity=".12"/>`;
  for (let v = 0; v <= maxV; v += 5){
    s += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/>`;
    s += `<text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`;
  }
  const single = selectedYears.length === 1;
  pts.forEach((p,i) => {
    if (single || p.mes === 0 || i === 0){
      const lab = single ? MES_CORTO[p.mes] : String(p.anio);
      if (single && W < 520 && p.mes % 2) return;
      s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${lab}</text>`;
    }
  });
  const line = pts.map((p,i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join("");
  s += `<path d="${line}L${x(pts.length-1).toFixed(1)},${y(0)}L${x(0).toFixed(1)},${y(0)}Z" fill="var(--money)" opacity=".12"/>`;
  s += `<path d="${line}" fill="none" stroke="var(--money)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
  pts.forEach((p,i) => {
    const lv = nivelDe(p.v);
    const col = lv === "ok" ? "var(--money)" : lv === "warn" ? "var(--warn)" : "var(--crit)";
    s += `<circle cx="${x(i)}" cy="${y(p.v)}" r="${pts.length > 40 ? 2.5 : 3.5}" fill="${col}"><title>${esc(p.label)}: ${pct(p.v)}</title></circle>`;
  });
  el.innerHTML = s + "</svg>";
}
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => current && renderChart(current), 150); });

/* ---------- estado y errores ---------- */
function banner(msg, crit){
  const b = $("banner");
  if (!msg){ b.hidden = true; b.textContent = ""; return; }
  b.hidden = false; b.className = "banner" + (crit ? " crit" : ""); b.textContent = msg;
}

function cargar(){
  if (cargando) return;
  cargando = true;
  const btn = $("refresh"); btn.disabled = true; btn.textContent = "Actualizando…";
  fetch(CSV_URL + "&_=" + Date.now(), {cache:"no-store"})
    .then(r => { if (!r.ok) throw new Error("respuesta " + r.status); return r.text(); })
    .then(txt => {
      if (/^\s*</.test(txt)) throw new Error("la planilla no está publicada como CSV");
      const d = extraer(txt);
      if (!d.raw.length) throw new Error("la planilla llegó vacía");
      current = d; render(d);
      stampAt = Date.now(); setStamp();
      $("dot").className = "dot live"; banner("");
    })
    .catch(err => {
      if (current){
        $("dot").className = "dot stale";
        banner("No se pudo actualizar (" + err.message + "). Se muestran los últimos datos leídos.");
      } else {
        $("main").innerHTML = `<p class="empty-state">No se pudo leer la planilla (${esc(err.message)}). Revisá que siga publicada en la Web (Archivo → Compartir → Publicar en la Web) y tocá Actualizar.</p>`;
        $("fecha").textContent = "Sin datos";
        $("stamp").textContent = "Sin conexión con la planilla";
        $("resumen").textContent = "";
      }
    })
    .finally(() => { cargando = false; btn.disabled = false; btn.textContent = "Actualizar"; });
}
function setStamp(){
  if (!stampAt) return;
  const mins = Math.floor((Date.now() - stampAt) / 60000);
  $("stamp").textContent = "Actualizado " + (mins < 1 ? "recién" : mins === 1 ? "hace 1 minuto" : `hace ${mins} minutos`);
}
$("refresh").addEventListener("click", cargar);
setInterval(setStamp, 30000);
setInterval(() => { if (!document.hidden) cargar(); }, REFRESCO_MS);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && stampAt && Date.now() - stampAt > REFRESCO_MS) cargar();
});
cargar();
})();
</script>
</body>
</html>
